name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supply-chain hardening: every third-party action is pinned to a full commit
# SHA (tags are mutable). The trailing comment records the tag the SHA was
# resolved from; bump both together. dtolnay/rust-toolchain is pinned to a
# commit of its `stable` branch; the Rust VERSION itself is pinned exactly
# (never `stable`) so WASM hashes and CPU-instruction measurements are
# reproducible. It must match rust-toolchain.toml — the "toolchain pin
# consistency" step fails the build if they drift.

jobs:
  contract:
    name: Soroban contract (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
          targets: wasm32v1-none

      - name: Toolchain pin consistency (ci.yml == rust-toolchain.toml)
        run: |
          grep -q '^channel = "1.95.0"$' rust-toolchain.toml \
            || { echo "rust-toolchain.toml channel != 1.95.0 pinned in ci.yml"; exit 1; }
          rustc --version | grep -q '^rustc 1\.95\.0 ' \
            || { echo "active rustc is not 1.95.0: $(rustc --version)"; exit 1; }

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            soroban-contract/target
          key: ${{ runner.os }}-cargo-contract-${{ hashFiles('rust-toolchain.toml', 'soroban-contract/Cargo.lock') }}

      # The FULL suite: unit tests, integration tests (tests/), and doc-tests.
      # This is the same command documented for local runs, so "tests pass
      # locally" and "tests pass in CI" mean the same thing.
      - name: cargo test (all targets + doc-tests)
        working-directory: soroban-contract
        run: |
          cargo test --all-targets
          cargo test --doc

      - name: Reviewer evidence — BLS / drand rejection paths
        working-directory: soroban-contract
        run: |
          cargo test --lib test::test_fulfill_invalid_drand_bls_signature -- --exact --nocapture
          cargo test --lib test::test_fulfill_delayed_drand_round_rejected -- --exact --nocapture

      - name: Reviewer evidence — CPU instruction measurements
        working-directory: soroban-contract
        run: |
          cargo test --lib test::test_budget_g1_negation_cpu_instructions -- --exact --nocapture
          cargo test --lib test::test_budget_sac_transfer_cpu_instructions -- --exact --nocapture

      - name: Reviewer evidence — key rotation vs pending requests
        working-directory: soroban-contract
        run: cargo test --lib rotate_keys -- --nocapture

      - name: cargo fmt --check (contract, fuzz targets, consumer example)
        run: |
          (cd soroban-contract && cargo fmt --check)
          (cd soroban-contract/fuzz && cargo fmt --check)
          (cd consumer-example && cargo fmt --check)

      - name: cargo clippy (all targets, including tests)
        working-directory: soroban-contract
        run: cargo clippy --all-targets -- -D warnings

      - name: Fuzz targets compile
        working-directory: soroban-contract/fuzz
        run: cargo check --bins

  fuzz-smoke:
    name: Fuzz smoke run (bounded, 10k runs per target)
    runs-on: ubuntu-latest
    # A bounded run, not a fuzzing campaign: it proves every target executes
    # thousands of randomized inputs without a crash on each change. The
    # per-target log is uploaded as evidence.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly Rust (cargo-fuzz needs -Z sanitizer)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: nightly-2026-09-01
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-09-01 install cargo-fuzz --version 0.13.2 --locked
      - name: Run every target for 10,000 inputs
        working-directory: soroban-contract
        run: |
          mkdir -p fuzz-evidence
          for t in $(cargo +nightly-2026-09-01 fuzz list); do
            echo "=== $t ===" | tee -a fuzz-evidence/summary.txt
            cargo +nightly-2026-09-01 fuzz run "$t" -- -runs=10000 -seed=1 2>&1 \
              | tee "fuzz-evidence/$t.log" | grep -E '^(Done|#10000)' | tee -a fuzz-evidence/summary.txt
            grep -q '^Done 10000 runs' "fuzz-evidence/$t.log" \
              || { echo "$t did not complete 10000 runs"; exit 1; }
          done
      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-smoke-evidence
          path: soroban-contract/fuzz-evidence/

      - name: Release WASM build (pinned toolchain) + SHA256
        working-directory: soroban-contract
        run: |
          cargo build --release --target wasm32v1-none
          sha256sum target/wasm32v1-none/release/*.wasm

  rust-sdk:
    name: Rust SDK (test + package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - name: cargo fmt --check
        working-directory: sdk/rust
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: sdk/rust
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: sdk/rust
        run: cargo test
      - name: Verify crate is publishable
        working-directory: sdk/rust
        run: cargo package --list

  oracle-worker:
    name: Oracle worker (test + build + failover drill)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6399:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        working-directory: oracle-worker
        run: npm ci
      - name: Unit tests (drand delay/retry/backoff, listener)
        working-directory: oracle-worker
        run: npm test
      - name: TypeScript build
        working-directory: oracle-worker
        run: npm run build
      - name: Failover drill (real Redis — election, fencing, takeover)
        working-directory: oracle-worker
        env:
          REDIS_URL: redis://127.0.0.1:6399
        run: node failover_drill.mjs
      - name: Spend-ledger drill (real Redis — unpaid budget shared across instances, never exceeded)
        working-directory: oracle-worker
        env:
          REDIS_URL: redis://127.0.0.1:6399
        run: node spend_ledger_drill.mjs
      - name: File-mutex drill (real processes — no lost updates, file ledger never overshoots)
        working-directory: oracle-worker
        run: node file_mutex_drill.mjs

  js-sdk:
    name: JS SDK (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        working-directory: sdk/js
        run: npm install
      - name: Build (tsc)
        working-directory: sdk/js
        run: npm run build
      - name: Verify package is publishable (public access, correct contents)
        working-directory: sdk/js
        run: npm publish --dry-run

  docker:
    name: Oracle worker Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        working-directory: oracle-worker
        run: docker build -t stellar-vrf-oracle:ci .

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
