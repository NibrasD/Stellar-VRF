name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supply-chain hardening: every third-party action is pinned to a full commit
# SHA (tags are mutable). The trailing comment records the tag the SHA was
# resolved from; bump both together. dtolnay/rust-toolchain is pinned to a
# commit of its `stable` branch and selects the channel via `toolchain:`.

jobs:
  contract:
    name: Soroban contract (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            soroban-contract/target
          key: ${{ runner.os }}-cargo-contract-${{ hashFiles('soroban-contract/Cargo.lock') }}

      - name: cargo test
        working-directory: soroban-contract
        run: cargo test --lib

      - name: Reviewer evidence — BLS / drand rejection paths
        working-directory: soroban-contract
        run: |
          cargo test --lib test::test_fulfill_invalid_drand_bls_signature -- --exact --nocapture
          cargo test --lib test::test_fulfill_delayed_drand_round_rejected -- --exact --nocapture

      - name: Reviewer evidence — CPU instruction measurements
        working-directory: soroban-contract
        run: |
          cargo test --lib test::test_budget_g1_negation_cpu_instructions -- --exact --nocapture
          cargo test --lib test::test_budget_sac_transfer_cpu_instructions -- --exact --nocapture

      - name: Reviewer evidence — key rotation vs pending requests
        working-directory: soroban-contract
        run: cargo test --lib rotate_keys -- --nocapture

      - name: cargo clippy
        working-directory: soroban-contract
        run: cargo clippy --lib -- -D warnings

  rust-sdk:
    name: Rust SDK (test + package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - name: cargo test
        working-directory: sdk/rust
        run: cargo test
      - name: Verify crate is publishable
        working-directory: sdk/rust
        run: cargo package --list

  oracle-worker:
    name: Oracle worker (test + build + failover drill)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6399:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        working-directory: oracle-worker
        run: npm ci
      - name: Unit tests (drand delay/retry/backoff, listener)
        working-directory: oracle-worker
        run: npm test
      - name: TypeScript build
        working-directory: oracle-worker
        run: npm run build
      - name: Failover drill (real Redis — election, fencing, takeover)
        working-directory: oracle-worker
        env:
          REDIS_URL: redis://127.0.0.1:6399
        run: node failover_drill.mjs

  js-sdk:
    name: JS SDK (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        working-directory: sdk/js
        run: npm install
      - name: Build (tsc)
        working-directory: sdk/js
        run: npm run build
      - name: Verify package is publishable (public access, correct contents)
        working-directory: sdk/js
        run: npm publish --dry-run

  docker:
    name: Oracle worker Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        working-directory: oracle-worker
        run: docker build -t stellar-vrf-oracle:ci .

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
