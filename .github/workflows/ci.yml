name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Soroban contract (secure-onchain profile)
        run: cargo build --manifest-path soroban-contract/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Enforce contract size gate
        run: |
          WASM="soroban-contract/target/wasm32-unknown-unknown/release/soroban_vrf_oracle.wasm"
          SIZE=$(stat -c%s "$WASM")
          MAX=250000
          echo "WASM size: $SIZE bytes (max: $MAX)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::Contract size regression: $SIZE > $MAX"
            exit 1
          fi

      - name: Run unit tests (api-server)
        run: pnpm --filter @workspace/api-server test --run

      - name: Run property tests (api-server) [optional]
        if: ${{ env.RUN_PROPERTY_TESTS == '1' }}
        env:
          RUN_PROPERTY_TESTS: ${{ secrets.RUN_PROPERTY_TESTS }}
        run: pnpm --filter @workspace/api-server run test:property

      - name: Dependency audit (json)
        run: |
          pnpm audit --json > audit.json || true
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit.json

  onchain-integration:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    environment: integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Assert required integration secrets
        run: |
          test -n "${{ secrets.VRF_PRIVATE_KEY_HEX }}" || (echo "::error::Missing VRF_PRIVATE_KEY_HEX" && exit 1)
          test -n "${{ secrets.ORACLE_STELLAR_SEED }}" || (echo "::error::Missing ORACLE_STELLAR_SEED" && exit 1)
          test -n "${{ secrets.SOROBAN_URL }}" || (echo "::error::Missing SOROBAN_URL" && exit 1)
          test -n "${{ secrets.SOROBAN_NETWORK }}" || (echo "::error::Missing SOROBAN_NETWORK" && exit 1)
          test -n "${{ secrets.DRAND_REQUIRED }}" || (echo "::error::Missing DRAND_REQUIRED" && exit 1)
          test -n "${{ secrets.REQUIRE_REMOTE_SIGNER }}" || (echo "::error::Missing REQUIRE_REMOTE_SIGNER" && exit 1)
          test -n "${{ secrets.ORACLE_SIGNER_URL }}" || (echo "::error::Missing ORACLE_SIGNER_URL" && exit 1)
          # If using AWS KMS via OIDC, ensure role and region provided
          test -n "${{ secrets.AWS_ROLE_ARN }}" || (echo "::warning::AWS_ROLE_ARN not set - skipping OIDC configuration" )
          test -n "${{ secrets.AWS_REGION }}" || (echo "::warning::AWS_REGION not set - default region may be used" )

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        if: ${{ env.AWS_ROLE_ARN != '' }}
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run always-on Soroban integration tests
        env:
          RUN_INTEGRATION: "1"
          VRF_PRIVATE_KEY_HEX: ${{ secrets.VRF_PRIVATE_KEY_HEX }}
          ORACLE_STELLAR_SEED: ${{ secrets.ORACLE_STELLAR_SEED }}
          SOROBAN_URL: ${{ secrets.SOROBAN_URL }}
          SOROBAN_NETWORK: ${{ secrets.SOROBAN_NETWORK }}
          DRAND_REQUIRED: ${{ secrets.DRAND_REQUIRED }}
          REQUIRE_REMOTE_SIGNER: ${{ secrets.REQUIRE_REMOTE_SIGNER }}
          ORACLE_SIGNER_URL: ${{ secrets.ORACLE_SIGNER_URL }}
          # KMS / Secrets Manager configuration for production signing
          KMS_PROVIDER: ${{ secrets.KMS_PROVIDER }}
          KMS_AWS_KEY_ID: ${{ secrets.KMS_AWS_KEY_ID }}
          KMS_AWS_VRF_SECRET_ARN: ${{ secrets.KMS_AWS_VRF_SECRET_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: pnpm --filter @workspace/api-server run test:integration
