name: Deploy to GitHub Pages

# Publishes the site to the `gh-pages` branch.
#
# Why a branch instead of actions/deploy-pages: the `github-pages` environment on
# this repo carries a protection rule that aborts the job at "Set up job" before
# any step runs, so the official Pages deployment action never executes. Pushing
# a branch needs no environment, and works with Pages configured as
# "Deploy from a branch" (Settings -> Pages -> Source: gh-pages / root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build site structure
        run: |
          rm -rf _site
          mkdir -p _site/dashboard _site/playground _site/example-dapp
          cp docs-site/index.html    _site/index.html
          cp dashboard/index.html    _site/dashboard/index.html
          cp playground/index.html   _site/playground/index.html
          cp example-dapp/index.html _site/example-dapp/index.html
          # Disable Jekyll so files are served verbatim.
          touch _site/.nojekyll

      - name: Verify the built site is current
        run: |
          set -e
          NEW=CAW6KECQMHRTX2GS3JVHWBMOB5JNNOHNOCE635RQS4SWJ72YF56EUPRX
          fail=0
          for f in _site/dashboard/index.html _site/playground/index.html _site/example-dapp/index.html; do
            if ! grep -q "$NEW" "$f"; then echo "::error::$f missing current mainnet contract"; fail=1; fi
            if grep -q "CCN75KEG" "$f"; then echo "::error::$f still contains the OLD contract"; fail=1; fi
            if grep -q "@stellar-vrf/sdk" "$f"; then echo "::error::$f uses the old package name"; fail=1; fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "site content verified"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
