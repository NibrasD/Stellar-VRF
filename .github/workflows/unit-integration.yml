name: Basic CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build api-server
        run: pnpm --filter @workspace/api-server run build

      - name: Run unit tests
        run: pnpm --filter @workspace/api-server run test
        env:
          CI: 'true'

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    if: ${{ env.RUN_INTEGRATION == '1' }}
    env:
      RUN_INTEGRATION: ${{ secrets.RUN_INTEGRATION }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vrf_user
          POSTGRES_PASSWORD: vrf_pass
          POSTGRES_DB: vrf_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres..."
          for i in `seq 1 30`; do
            pg_isready -h postgres -p 5432 -U vrf_user && exit 0 || sleep 1
          done
          echo "Postgres did not become available" && exit 1
        env:
          PGPASSWORD: vrf_pass

      - name: Run integration tests
        run: pnpm --filter @workspace/api-server run test:integration
        env:
          DATABASE_URL: postgresql://vrf_user:vrf_pass@postgres:5432/vrf_db
          RUN_INTEGRATION: '1'
          VRF_PRIVATE_KEY_HEX: ${{ secrets.VRF_PRIVATE_KEY_HEX }}
          ORACLE_VRF_PRIVATE_KEYS: ${{ secrets.ORACLE_VRF_PRIVATE_KEYS }}
          ORACLE_STELLAR_SEEDS: ${{ secrets.ORACLE_STELLAR_SEEDS }}
          ORACLE_STELLAR_SEED: ${{ secrets.ORACLE_STELLAR_SEED }}
          SOROBAN_URL: ${{ secrets.SOROBAN_URL }}
          SOROBAN_NETWORK: ${{ secrets.SOROBAN_NETWORK }}
          FRIEND_BOT_URL: ${{ secrets.FRIEND_BOT_URL }}
          # KMS / Secrets Manager integration (optional)
          KMS_PROVIDER: ${{ secrets.KMS_PROVIDER }}
          KMS_AWS_KEY_ID: ${{ secrets.KMS_AWS_KEY_ID }}
          KMS_AWS_VRF_SECRET_ARN: ${{ secrets.KMS_AWS_VRF_SECRET_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
