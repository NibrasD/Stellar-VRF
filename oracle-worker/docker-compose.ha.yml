version: "3.8"

# HA Oracle Deployment: Primary + Hot-Standby with DISTRIBUTED leader election.
#
# Leader election uses a shared Redis lease (see src/redisLock.ts), so the two
# workers coordinate over the network — they do NOT need a shared filesystem and
# can run on SEPARATE hosts in production (see "Multi-host production" below).
#
# Single-host demo:
#   docker compose -f docker-compose.ha.yml up -d
#
# Test failover:
#   docker compose -f docker-compose.ha.yml stop oracle-primary
#   # standby becomes leader within LEADER_LOCK_TTL_MS (30s)
#
# ── Multi-host production ────────────────────────────────────────────────────
# Run ONE managed/HA Redis reachable by both hosts, then deploy oracle-primary
# on host A and oracle-standby on host B, each with the SAME REDIS_URL pointing
# at that Redis. Because leadership lives in Redis (not a local file), whichever
# node holds the lease is the sole submitter, and the other takes over
# automatically if the leader dies.

services:
  redis:
    image: redis:7-alpine
    container_name: vrf-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in environment}"]
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in environment}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  oracle-primary:
    build: .
    container_name: vrf-oracle-primary
    env_file: .env
    environment:
      INSTANCE_ID: oracle-primary
      HEALTH_PORT: "8080"
      # Distributed leader election via Redis (multi-server safe).
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in environment}@redis:6379"
      LEADER_REDIS_KEY: vrf-oracle:leader
      LEADER_LOCK_TTL_MS: "30000"
      LEADER_HEARTBEAT_MS: "10000"
      LEADER_POLL_MS: "5000"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  oracle-standby:
    build: .
    container_name: vrf-oracle-standby
    env_file: .env
    environment:
      INSTANCE_ID: oracle-standby
      HEALTH_PORT: "8081"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in environment}@redis:6379"
      LEADER_REDIS_KEY: vrf-oracle:leader
      LEADER_LOCK_TTL_MS: "30000"
      LEADER_HEARTBEAT_MS: "10000"
      LEADER_POLL_MS: "5000"
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
