services:
  # ── Backend: Node.js API Service ───────────────────────────────────────────
  - type: web
    name: soroban-vrf-api
    env: node
    plan: free # Use free tier for hackathon
    rootDir: .
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm --filter @workspace/api-server run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # User must set this in the Render dashboard
      - key: PORT
        value: 8080

  # ── Frontend: Static Site ──────────────────────────────────────────────────
  - type: static
    name: soroban-vrf-frontend
    env: static
    plan: free
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @workspace/soroban-vrf run build
    publishDir: artifacts/soroban-vrf/dist/public
    envVars:
      - key: VITE_API_URL
        sync: false # User must set this to the URL of the soroban-vrf-api service
