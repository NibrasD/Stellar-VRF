services:
  # ── Backend: Node.js API Service ───────────────────────────────────────────
  - type: web
    name: soroban-vrf-api
    env: node
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @workspace/api-server... run build
    startCommand: pnpm --filter @workspace/api-server run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # User must set this in the Render dashboard
      - key: PORT
        value: 8080

  # ── Frontend: Web Service with SPA Fallback ────────────────────────────────
  - type: web
    name: soroban-vrf-frontend
    env: node
    buildCommand: pnpm install && pnpm --filter @workspace/soroban-vrf... run build
    startCommand: npx serve -s artifacts/soroban-vrf/dist/public -p 10000
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: PORT
        value: 10000
