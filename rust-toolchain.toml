# Pinned Rust toolchain for reproducible WASM builds and CPU/budget measurements.
# rustup/cargo honour this file for every crate under the repo root.
# CI installs the same version explicitly (dtolnay/rust-toolchain does not read
# this file) and a CI step fails if the two ever drift apart.
# Bump deliberately: update this file AND `toolchain:` in .github/workflows/ci.yml,
# then re-record the release WASM SHA256 in docs/OPERATIONS.md.
[toolchain]
channel = "1.95.0"
components = ["clippy", "rustfmt"]
targets = ["wasm32v1-none"]
profile = "minimal"
