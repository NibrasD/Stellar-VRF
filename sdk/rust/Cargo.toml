[package]
name = "stellar-vrf-sdk"
version = "1.0.0"
edition = "2021"
description = "Rust SDK for the Stellar VRF Oracle"
license = "MIT"
repository = "https://github.com/NibrasD/Stellar-VRF"
keywords = ["stellar", "soroban", "vrf", "randomness", "oracle"]

[dependencies]
# NOTE: This SDK intentionally avoids the heavy `stellar-xdr` crate. Read
# operations are performed via Soroban JSON-RPC `simulateTransaction` using
# hand-rolled XDR byte builders (see src/lib.rs), keeping the dependency
# footprint minimal.
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"

[dev-dependencies]
tokio-test = "0.4"
