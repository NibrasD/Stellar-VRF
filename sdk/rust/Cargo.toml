[package]
name = "stellar-vrf-sdk"
version = "1.0.0"
edition = "2021"
description = "Rust SDK for the Stellar VRF Oracle"
license = "MIT"
repository = "https://github.com/NibrasD/Stellar-VRF"
keywords = ["stellar", "soroban", "vrf", "randomness", "oracle"]

[dependencies]
stellar-xdr = { version = "0.0.35", features = ["curr"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hex = "0.4"
thiserror = "1"

[dev-dependencies]
tokio-test = "0.4"
