[package]
name = "stellar-vrf-sdk"
version = "1.0.1"
edition = "2021"
description = "Rust SDK for the Stellar VRF Oracle — verifiable on-chain randomness for Stellar/Soroban, backed by drand and on-chain BLS12-381 pairing verification"
license = "MIT"
repository = "https://github.com/NibrasD/Stellar-VRF"
homepage = "https://github.com/NibrasD/Stellar-VRF"
documentation = "https://docs.rs/stellar-vrf-sdk"
readme = "README.md"
keywords = ["stellar", "soroban", "vrf", "randomness", "oracle"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]

[dependencies]
# NOTE: This SDK intentionally avoids the heavy `stellar-xdr` crate. Read
# operations are performed via Soroban JSON-RPC `simulateTransaction` using
# hand-rolled XDR byte builders (see src/lib.rs), keeping the dependency
# footprint minimal.
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"

[dev-dependencies]
tokio-test = "0.4"
